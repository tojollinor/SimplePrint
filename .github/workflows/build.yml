name: Build SimplePrint

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Installer
          path: |
            dist/Installer/SimplePrint-Setup.exe
            dist/Installer/SimplePrint-Setup-*.exe

      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Published
          path: dist/Unified/**

      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version konnte nicht ermittelt werden."
          }

          $tag = "v$version"
          $offline = "dist\Installer\SimplePrint-Setup-$version.exe"
          $online = "dist\Installer\SimplePrint-Setup.exe"

          if (-not (Test-Path $offline)) {
            throw "Offline-Installer fehlt: $offline"
          }
          if (-not (Test-Path $online)) {
            throw "Online-Installer fehlt: $online"
          }

          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $exists = $null -ne (
            $releases |
              Where-Object { $_.tagName -eq $tag } |
              Select-Object -First 1
          )

          if (-not $exists) {
            gh release create $tag `
              --title "SimplePrint $version" `
              --target "$env:GITHUB_SHA" `
              --notes "SimplePrint $version vereinigt Server und Client in einer Anwendung und einem Dienst. Enthalten sind Multi-Geräte-Druckerverbindungen, gemeinsame Diagnosepakete sowie Online- und Offline-Installer."
          }

          foreach ($installer in @($offline, $online)) {
            $name = Split-Path $installer -Leaf
            if ($exists) {
              gh release delete-asset $tag $name -y 2>$null
            }
            gh release upload $tag $installer
          }
