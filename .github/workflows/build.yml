name: Build SimplePrint

on:
  workflow_dispatch:
  push:
    branches: [ main, dev/0.2.2 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Installer
          path: dist/Installer/*.exe
      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Published
          path: |
            dist/Server/**
            dist/Client/**
      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version konnte nicht ermittelt werden." }
          $tag = "v$version"
          $installer = Get-ChildItem "dist\Installer\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer wurde nicht gefunden." }

          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $exists = $null -ne ($releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1)

          if ($exists) {
            gh release delete-asset $tag $installer.Name -y 2>$null
            gh release upload $tag "$($installer.FullName)"
          }
          else {
            gh release create $tag "$($installer.FullName)" `
              --title "SimplePrint $version" `
              --target "$env:GITHUB_SHA" `
              --notes "SimplePrint ${version}: direkter IPP-/WSD-Druck für Microsoft IPP Class Driver, exakte Class-Driver-Zuordnung im Tunnel, Schutz gegen rekursive SimplePrint-Druckschleifen sowie End-to-End-Druckbereitschaft mit Geräte- und Spoolerstatus."
          }