name: Build SimplePrint

on:
  workflow_dispatch:
  push:
    branches: [ main, dev/0.2.3 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Installer
          path: dist/Installer/*.exe
      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Published
          path: |
            dist/Server/**
            dist/Client/**
      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version konnte nicht ermittelt werden." }
          $tag = "v$version"
          $installers = @(Get-ChildItem "dist\Installer\SimplePrint-*-Setup-$version.exe" | Sort-Object Name)
          if ($installers.Count -ne 2) { throw "Server- und Client-Installer wurden nicht vollständig gefunden." }

          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $exists = $null -ne ($releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1)

          if (-not $exists) {
            gh release create $tag `
              --title "SimplePrint $version" `
              --target "$env:GITHUB_SHA" `
              --notes "SimplePrint ${version}: getrennte Server-/Client-Installer, automatische GitHub-Release-Updates, verbesserte Druckerauswahl sowie die bisherigen IPP-/WSD-, Class-Driver-, Loop-Schutz- und Diagnosefunktionen."
          }

          foreach ($installer in $installers) {
            if ($exists) {
              gh release delete-asset $tag $installer.Name -y 2>$null
            }
            gh release upload $tag "$($installer.FullName)"
          }