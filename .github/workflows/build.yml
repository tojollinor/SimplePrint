name: Build SimplePrint

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Installer
          path: dist/Installer/*.exe
      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: SimplePrint-Published
          path: |
            dist/Server/**
            dist/Client/**
      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "dist\Installer\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer wurde nicht gefunden." }

          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.1.0 "$($installer.FullName)" --clobber
          }
          else {
            gh release create v0.1.0 "$($installer.FullName)" `
              --title "SimplePrint 0.1.0" `
              --target "$env:GITHUB_SHA" `
              --notes "Erste veröffentlichte SimplePrint-Version mit getrenntem Server und Client, automatischer Server-Erkennung, Druckerverwaltung und Windows-Installer."
          }
